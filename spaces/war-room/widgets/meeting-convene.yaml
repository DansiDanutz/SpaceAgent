schema: space-widget/v1
cols: 6
rows: 5
title: Convene Meeting
refresh_interval: 0
renderer: |
  async function(api) {
    const container = document.createElement('div');
    container.style.cssText = 'padding:12px;font-family:system-ui;height:100%;overflow:auto;';
    container.innerHTML = `
      <div style="font-weight:600;font-size:14px;color:#e2e8f0;margin-bottom:10px;">🎙️ Convene War Room</div>
      <div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:8px;padding:12px;">
        <div style="font-size:12px;font-weight:600;color:#f59e0b;margin-bottom:5px;">Read-only containment active</div>
        <div style="font-size:11px;color:#94a3b8;line-height:1.5;">Meeting creation and pinning are unavailable until the War Room API enforces authenticated operator authorization.</div>
      </div>
    `;
    return container;
  }
