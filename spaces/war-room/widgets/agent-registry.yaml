schema: space-widget/v1
cols: 6
rows: 5
title: Agent Registry
refresh_interval: 30000
renderer: |
  async function(api) {
    const container = document.createElement('div');
    container.style.cssText = 'padding:12px;font-family:system-ui;height:100%;overflow:auto;';
    
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;';
    header.innerHTML = '<span style="font-weight:600;font-size:14px;color:#e2e8f0;">🎭 Agent Fleet</span><span id="agent-last-update" style="font-size:10px;color:#64748b;">loading...</span>';
    container.appendChild(header);
    
    const grid = document.createElement('div');
    grid.id = 'agent-grid';
    grid.style.cssText = 'display:grid;grid-template-columns:1fr;gap:6px;';
    grid.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;padding:20px;">⏳ Fetching agent health...</div>';
    container.appendChild(grid);
    
    async function fetchAgents() {
      try {
        const resp = await fetch('http://100.79.10.102:8765/api/agent/health', { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        
        const agents = data.agents || [];
        const now = new Date();
        
        let html = '';
        for (const a of agents) {
          const healthColor = a.health_pct >= 95 ? '#22c55e' : a.health_pct >= 80 ? '#f59e0b' : '#ef4444';
          const healthBg = a.health_pct >= 95 ? 'rgba(34,197,94,0.1)' : a.health_pct >= 80 ? 'rgba(245,158,11,0.1)' : 'rgba(239,68,68,0.1)';
          const lastRun = a.last_run_at ? new Date(a.last_run_at) : null;
          const ago = lastRun ? Math.round((now - lastRun) / 60000) : null;
          const agoText = ago !== null ? (ago < 60 ? ago + 'm ago' : Math.round(ago/60) + 'h ago') : 'never';
          
          const dots = (a.dots || []).slice(-8).map(d => {
            const color = d.status === 'success' ? '#22c55e' : d.status === 'failed' ? '#ef4444' : '#64748b';
            return `<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${color};margin-right:2px;" title="${d.status} @ ${d.created_at ? new Date(d.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '?'}"></span>`;
          }).join('');
          
          html += `<div style="background:${healthBg};border:1px solid ${healthColor}30;border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="width:8px;height:8px;border-radius:50%;background:${healthColor};box-shadow:0 0 6px ${healthColor}80;"></div>
              <div>
                <div style="font-size:12px;font-weight:600;color:#e2e8f0;">${a.agent_name}</div>
                <div style="font-size:10px;color:#64748b;">${a.agent_source} · ${a.total_runs} runs · ${a.successes}✓ ${a.failures > 0 ? '<span style="color:#ef4444;">'+a.failures+'✗</span>' : ''}</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:14px;font-weight:700;color:${healthColor};">${a.health_pct.toFixed(0)}%</div>
              <div style="font-size:9px;color:#64748b;">${agoText}</div>
              <div style="margin-top:3px;">${dots}</div>
            </div>
          </div>`;
        }
        
        grid.innerHTML = html || '<div style="color:#64748b;font-size:12px;text-align:center;padding:20px;">No agents found</div>';
        container.querySelector('#agent-last-update').textContent = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) + ' EET';
      } catch (e) {
        grid.innerHTML = `<div style="color:#ef4444;font-size:12px;text-align:center;padding:20px;">🔴 SemeClaw unreachable<br/><span style="font-size:10px;color:#64748b;">${e.message}</span></div>`;
        container.querySelector('#agent-last-update').textContent = 'failed';
      }
    }
    
    await fetchAgents();
    const interval = setInterval(fetchAgents, 30000);
    container._cleanup = () => clearInterval(interval);
    
    return container;
  }
