schema: space-widget/v1
cols: 6
rows: 5
title: Paperclip Board
refresh_interval: 30000
renderer: |
  async function(api) {
    const container = document.createElement('div');
    container.style.cssText = 'padding:12px;font-family:system-ui;height:100%;overflow:auto;';
    
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;';
    header.innerHTML = '<span style="font-weight:600;font-size:14px;color:#e2e8f0;">📎 Paperclip</span><span id="pc-last-update" style="font-size:10px;color:#64748b;">loading...</span>';
    container.appendChild(header);
    
    const grid = document.createElement('div');
    grid.id = 'pc-grid';
    grid.style.cssText = 'display:grid;grid-template-columns:1fr;gap:6px;';
    grid.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;padding:20px;">⏳ Fetching Paperclip state...</div>';
    container.appendChild(grid);
    
    async function fetchBoard() {
      try {
        const resp = await fetch('http://100.79.10.102:8765/api/state', { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        
        const pc = data.paperclip || {};
        const connected = pc.connected === true;
        const connColor = connected ? '#22c55e' : '#ef4444';
        
        let html = '';
        
        // Connection status
        html += `<div style="background:rgba(255,255,255,0.03);border:1px solid ${connColor}30;border-radius:8px;padding:8px 10px;margin-bottom:6px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="width:8px;height:8px;border-radius:50%;background:${connColor};box-shadow:0 0 6px ${connColor}60;"></div>
            <span style="font-size:12px;font-weight:600;color:#e2e8f0;">${connected ? 'Connected' : 'Disconnected'}</span>
            <span style="font-size:9px;color:#64748b;margin-left:auto;">${pc.last_sync ? new Date(pc.last_sync).toLocaleString('en-GB') : 'never synced'}</span>
          </div>
        </div>`;
        
        // Metrics
        const m = data.metrics || {};
        html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;">
          <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:6px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#22c55e;">${m.tasks_run || 0}</div>
            <div style="font-size:9px;color:#64748b;">Tasks Run</div>
          </div>
          <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:6px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#22c55e;">${m.tasks_succeeded || 0}</div>
            <div style="font-size:9px;color:#64748b;">Succeeded</div>
          </div>
          <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:6px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:${m.tasks_failed > 0 ? '#ef4444' : '#22c55e'};">${m.tasks_failed || 0}</div>
            <div style="font-size:9px;color:#64748b;">Failed</div>
          </div>
        </div>`;
        
        // Active tasks
        const active = data.active_tasks || [];
        if (active.length) {
          html += `<div style="font-size:10px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:4px;">Active (${active.length})</div>`;
          for (const t of active) {
            html += `<div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:6px;padding:6px 8px;margin-bottom:3px;">
              <div style="font-size:11px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.task || t.run_id || 'Unknown'}</div>
              <div style="font-size:9px;color:#64748b;">Agents: ${(t.agents || []).join(', ')} · ${t.issue_id || 'no issue'}</div>
            </div>`;
          }
        } else {
          html += `<div style="font-size:10px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:4px;">Active (0)</div>`;
          html += `<div style="color:#64748b;font-size:11px;text-align:center;padding:8px;">No active tasks</div>`;
        }
        
        // Completed tasks (last 3)
        const completed = (data.completed_tasks || []).slice(-3).reverse();
        if (completed.length) {
          html += `<div style="font-size:10px;color:#64748b;text-transform:uppercase;font-weight:600;margin:6px 0 4px;">Recently Completed</div>`;
          for (const t of completed) {
            const ago = t.completed_at ? Math.round((Date.now() - new Date(t.completed_at).getTime()) / 3600000) : null;
            html += `<div style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.15);border-radius:6px;padding:5px 8px;margin-bottom:3px;">
              <div style="font-size:10px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.task || t.run_id}</div>
              <div style="font-size:9px;color:#64748b;">${ago !== null ? ago + 'h ago' : ''} · ${(t.agents || []).join(', ')}</div>
            </div>`;
          }
        }
        
        grid.innerHTML = html;
        container.querySelector('#pc-last-update').textContent = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) + ' EET';
      } catch (e) {
        grid.innerHTML = `<div style="color:#ef4444;font-size:12px;text-align:center;padding:20px;">🔴 SemeClaw unreachable<br/><span style="font-size:10px;color:#64748b;">${e.message}</span></div>`;
        container.querySelector('#pc-last-update').textContent = 'failed';
      }
    }
    
    await fetchBoard();
    const interval = setInterval(fetchBoard, 30000);
    container._cleanup = () => clearInterval(interval);
    
    return container;
  }
