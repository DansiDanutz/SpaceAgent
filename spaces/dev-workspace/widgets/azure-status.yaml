cols: 6
id: azure-status
name: Azure Status
renderer: |-
  async (parent) => {
    const CACHE_KEY = "widget-azure-status-v1"
    const CACHE_TTL = 5 * 60 * 1000
    function getCached() {
      try {
        const raw = localStorage.getItem(CACHE_KEY)
        if (!raw) return null
        const parsed = JSON.parse(raw)
        if (Date.now() - parsed.ts > CACHE_TTL) return null
        return parsed.data
      } catch (e) { return null }
    }
    function setCached(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })) } catch (e) {}
    }

    parent.innerHTML = `
      <style>
        .az-root {
          font-family: system-ui, sans-serif;
          padding: clamp(8px, 2vw, 16px);
          color: #e0e0e0;
          width: 100%;
          height: 100%;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        .az-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: clamp(6px, 1.5vw, 12px);
        }
        .az-header h2 {
          margin: 0;
          font-size: clamp(14px, 2.5vw, 20px);
        }
        .az-list {
          flex: 1;
          overflow-y: auto;
          min-height: 0;
        }
        .az-item {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: clamp(4px, 1vw, 8px) 0;
          border-bottom: 1px solid #2d2d44;
        }
        .az-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          flex-shrink: 0;
        }
        .az-ok { background: #3fb950; }
        .az-warn { background: #f0c040; }
        .az-err { background: #f85149; }
        .az-name {
          font-size: clamp(10px, 1.3vw, 14px);
          flex: 1;
        }
        .az-status {
          font-size: clamp(9px, 1.1vw, 12px);
          color: #8b949e;
        }
        .az-loading { color: #8b949e; font-size: 12px; }
      </style>
      <div class="az-root">
        <div class="az-header">
          <h2>☁️ Azure Status</h2>
        </div>
        <div class="az-list" id="az-list">
          <div class="az-loading">Loading status...</div>
        </div>
      </div>`

    const list = document.getElementById("az-list")
    const cached = getCached()
    if (cached) {
      list.innerHTML = cached
      return
    }

    try {
      const res = await fetch("https://status.azure.com/en-us/status/feed/")
      const text = await res.text()
      const parser = new DOMParser()
      const xml = parser.parseFromString(text, "application/xml")
      const items = Array.from(xml.querySelectorAll("item")).slice(0, 10)

      const html = items.map(item => {
        const title = item.querySelector("title")?.textContent || "Unknown"
        const isOk = title.toLowerCase().includes("normal") || title.toLowerCase().includes("resolved")
        const isWarn = title.toLowerCase().includes("degraded") || title.toLowerCase().includes("investigating")
        const dotClass = isOk ? "az-ok" : (isWarn ? "az-warn" : "az-err")
        return `
          <div class="az-item">
            <div class="az-dot ${dotClass}"></div>
            <span class="az-name">${title}</span>
          </div>
        `
      }).join("")
      setCached(html)
      list.innerHTML = html
    } catch (e) {
      list.innerHTML = `<div class="az-loading">Error loading status.</div>`
    }
  }
rows: 10
schema: space-widget/v1
