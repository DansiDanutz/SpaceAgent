schema: space-widget/v1
cols: 6
rows: 5
title: GitHub Activity
refresh_interval: 60000
renderer: |
  async function(api) {
    const container = document.createElement('div');
    container.style.cssText = 'padding:12px;font-family:system-ui;height:100%;overflow:auto;';
    
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;';
    header.innerHTML = '<span style="font-weight:600;font-size:14px;color:#e2e8f0;">🔀 GitHub Activity</span><span id="gh-last-update" style="font-size:10px;color:#64748b;">loading...</span>';
    container.appendChild(header);
    
    const grid = document.createElement('div');
    grid.id = 'gh-grid';
    grid.style.cssText = 'display:grid;grid-template-columns:1fr;gap:5px;';
    grid.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;padding:20px;">⏳ Fetching from GitHub...</div>';
    container.appendChild(grid);
    
    const REPOS = [
      { owner: 'DansiDanutz', repo: 'SemeClaw', label: 'SemeClaw' },
      { owner: 'DansiDanutz', repo: 'MyWork-AI', label: 'MyWork-AI' },
      { owner: 'DansiDanutz', repo: 'nervix-cli', label: 'nervix-cli' },
      { owner: 'DansiDanutz', repo: 'sienna-crypto-girl', label: 'sienna' },
      { owner: 'DansiDanutz', repo: 'DansLab', label: 'DansLab' },
      { owner: 'DansiDanutz', repo: 'dexter-workspace', label: 'dexter' }
    ];
    
    async function fetchActivity() {
      try {
        let allPRs = [];
        let allEvents = [];
        
        await Promise.all(REPOS.map(async (r) => {
          try {
            // Fetch PRs
            const prResp = await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/pulls?state=all&per_page=5`, {
              headers: { Accept: 'application/vnd.github.v3+json' },
              cache: 'no-store'
            });
            if (prResp.ok) {
              const prs = await prResp.json();
              for (const p of prs) {
                allPRs.push({
                  repo: r.label,
                  number: p.number,
                  title: p.title,
                  state: p.state,
                  merged: p.merged_at !== null,
                  author: p.user?.login || '?',
                  created: p.created_at,
                  updated: p.updated_at,
                  url: p.html_url
                });
              }
            }
            
            // Fetch recent events
            const evResp = await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/events?per_page=3`, {
              headers: { Accept: 'application/vnd.github.v3+json' },
              cache: 'no-store'
            });
            if (evResp.ok) {
              const events = await evResp.json();
              for (const e of events) {
                allEvents.push({
                  repo: r.label,
                  type: e.type,
                  actor: e.actor?.login || '?',
                  created: e.created_at,
                  message: e.payload?.commits?.[0]?.message || e.payload?.release?.tag_name || e.type
                });
              }
            }
          } catch (e) { /* per-repo failure is ok */ }
        }));
        
        // Sort by recency
        allPRs.sort((a, b) => new Date(b.updated) - new Date(a.updated));
        allEvents.sort((a, b) => new Date(b.created) - new Date(a.created));
        
        let html = '';
        
        // Stats
        const openCount = allPRs.filter(p => p.state === 'open').length;
        const mergedCount = allPRs.filter(p => p.merged).length;
        html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;">
          <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:6px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#f59e0b;">${openCount}</div>
            <div style="font-size:9px;color:#64748b;">Open PRs</div>
          </div>
          <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:6px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#a855f7;">${mergedCount}</div>
            <div style="font-size:9px;color:#64748b;">Merged</div>
          </div>
          <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:6px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#22c55e;">${REPOS.length}</div>
            <div style="font-size:9px;color:#64748b;">Repos</div>
          </div>
        </div>`;
        
        // Recent PRs
        if (allPRs.length) {
          html += `<div style="font-size:10px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:4px;">Recent PRs</div>`;
          for (const p of allPRs.slice(0, 6)) {
            const stateColor = p.merged ? '#a855f7' : p.state === 'open' ? '#22c55e' : '#ef4444';
            const stateLabel = p.merged ? 'merged' : p.state;
            const ago = Math.round((Date.now() - new Date(p.updated).getTime()) / 3600000);
            const agoText = ago < 1 ? '<1h' : ago < 24 ? ago + 'h' : Math.round(ago/24) + 'd';
            html += `<a href="${p.url}" target="_blank" style="text-decoration:none;display:block;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:5px 8px;margin-bottom:3px;transition:background 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:9px;color:${stateColor};font-weight:600;text-transform:uppercase;white-space:nowrap;">${stateLabel}</span>
                <span style="font-size:10px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;">${p.title}</span>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:1px;">
                <span style="font-size:9px;color:#64748b;">${p.repo} #${p.number} by @${p.author}</span>
                <span style="font-size:9px;color:#64748b;">${agoText}</span>
              </div>
            </a>`;
          }
        }
        
        // Recent events
        if (allEvents.length) {
          html += `<div style="font-size:10px;color:#64748b;text-transform:uppercase;font-weight:600;margin:6px 0 4px;">Recent Events</div>`;
          for (const e of allEvents.slice(0, 4)) {
            const ago = Math.round((Date.now() - new Date(e.created).getTime()) / 3600000);
            const agoText = ago < 1 ? '<1h' : ago < 24 ? ago + 'h' : Math.round(ago/24) + 'd';
            const icon = e.type.includes('Push') ? '⬆️' : e.type.includes('Release') ? '🏷️' : e.type.includes('PullRequest') ? '🔀' : e.type.includes('Create') ? '➕' : '📌';
            html += `<div style="font-size:10px;color:#94a3b8;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
              ${icon} <span style="color:#64748b;">${e.repo}</span> · ${e.type.replace('Event', '')} by @${e.actor} · ${agoText}
            </div>`;
          }
        }
        
        grid.innerHTML = html || '<div style="color:#64748b;font-size:12px;text-align:center;padding:20px;">No activity found</div>';
        container.querySelector('#gh-last-update').textContent = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) + ' EET';
      } catch (e) {
        grid.innerHTML = `<div style="color:#ef4444;font-size:12px;text-align:center;padding:20px;">🔴 GitHub API error<br/><span style="font-size:10px;color:#64748b;">${e.message}</span></div>`;
        container.querySelector('#gh-last-update').textContent = 'failed';
      }
    }
    
    await fetchActivity();
    const interval = setInterval(fetchActivity, 60000);
    container._cleanup = () => clearInterval(interval);
    
    return container;
  }
